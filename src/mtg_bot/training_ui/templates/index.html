<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Pipeline Progress</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
    --text: #e2e8f0; --muted: #8892a4;
    --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6;
    --purple: #a855f7;
    --radius: 12px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 32px 24px;
  }
  .page { max-width: 900px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  #refresh-indicator { margin-left: auto; font-size: 0.75rem; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }

  .run-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .run-id { font-family: monospace; font-size: 0.95rem; color: var(--text); }
  .kind-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px;
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
  .kind-tag.data_gen { color: #93c5fd; border-color: #1e3a5f; }
  .kind-tag.training { color: #c4b5fd; border-color: #4c1d95; }
  .kind-tag.eval { color: #67e8f9; border-color: #155e75; }
  .kind-tag.bench { color: #fcd34d; border-color: #78350f; }
  .badge { font-size: 0.72rem; padding: 3px 10px; border-radius: 999px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.running { background: #1e3a5f; color: #93c5fd; animation: pulse 1.6s infinite; }
  .badge.completed { background: #14532d; color: #4ade80; }
  .badge.failed { background: #4c1d1d; color: #fca5a5; }
  .badge.stopped { background: #4c2d1d; color: #fcd34d; }
  .badge.unknown { background: #2a2d3a; color: var(--muted); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .run-meta { font-size: 0.78rem; color: var(--muted); font-family: monospace; }
  /* Training-card metadata pill (currently only used for
     policy_loss_weight when != 1.0). Lives next to .run-meta in the
     run-header so the formula behind TOTAL LOSS is visible at a
     glance. */
  .meta-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px;
    font-family: monospace; background: var(--bg);
    border: 1px solid var(--border); color: var(--muted); }
  /* Subtitle under TOTAL LOSS / parenthetical under POLICY LOSS:
     same monospace font as the value, smaller + muted so it reads
     as supporting information rather than the primary number. */
  .stat-sub { font-size: 0.7rem; color: var(--muted);
    font-family: monospace; margin-top: 3px; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .progress-bar {
    flex: 1; height: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--blue); transition: width 0.4s ease;
    border-radius: 999px;
  }
  .progress-fill.training { background: var(--purple); }
  .progress-fill.eval { background: #06b6d4; }
  .progress-fill.bench { background: #f59e0b; }
  .progress-fill.completed { background: var(--green); }
  .progress-fill.failed { background: var(--red); }
  .progress-fill.stopped { background: var(--amber); }
  .progress-pct { font-family: monospace; font-size: 0.9rem; min-width: 64px; text-align: right; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-top: 14px; }
  .stat { padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; }
  .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 4px; }
  .stat-value { font-size: 0.95rem; font-family: monospace; }

  .chart-wrap { margin-top: 20px; height: 240px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 600; }
  td.num { font-family: monospace; }
  .empty { font-size: 0.85rem; color: var(--muted); text-align: center;
    padding: 28px; border: 1px dashed var(--border); border-radius: var(--radius); }

  .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; }

  .replays-footer { margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border); font-size: 0.85rem;
    color: var(--muted); }
  .replays-footer .replays-toggle { background: none; border: 0;
    color: var(--blue); cursor: pointer; padding: 0; font: inherit;
    text-decoration: underline; }
  .replays-footer .replays-toggle:hover { color: #93c5fd; }
  .replays-footer .replays-list { margin-top: 10px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 4px 14px; font-family: monospace; font-size: 0.8rem; }
  .replays-footer .replays-list a { color: var(--text);
    text-decoration: none; }
  .replays-footer .replays-list a:hover { color: var(--blue);
    text-decoration: underline; }
  .replays-footer .replays-empty { font-style: italic; }

  /* Bench cards: per-pairing table + verdict pills. */
  .pairings-wrap { margin-top: 14px; overflow-x: auto; }
  .pairings { width: 100%; border-collapse: collapse;
    font-size: 0.82rem; }
  .pairings th, .pairings td { padding: 6px 8px;
    border-bottom: 1px solid var(--border); text-align: left;
    vertical-align: middle; }
  .pairings th { font-size: 0.65rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 600; }
  .pairings td.num { font-family: monospace; }
  .pairings td.match-up { font-family: monospace;
    white-space: nowrap; }
  .verdict { font-size: 0.65rem; padding: 2px 8px;
    border-radius: 4px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; }
  .verdict.stronger { background: #14532d; color: #4ade80; }
  .verdict.weaker { background: #4c1d1d; color: #fca5a5; }
  .verdict.comparable { background: #2a2d3a; color: var(--muted); }
  .verdict.pending { background: #1e3a5f; color: #93c5fd;
    animation: pulse 1.6s infinite; }
  .pairing-status { font-size: 0.65rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; }
  .pairing-status.running { color: #93c5fd; }
  .pairing-status.completed { color: #4ade80; }
  .pairing-status.failed { color: #fca5a5; }
  /* Wilson 95% CI badge on the eval card. PASS (CI lower bound clears
     the 0.52 acceptance threshold) renders green like the verdict
     "stronger" badge; FAIL (CI upper bound below threshold) renders red
     like "weaker"; UNDECIDED (threshold straddles the CI) renders amber
     so a glance at the eval card surfaces gate-direction confidence
     without doing the math by eye. */
  .stat-value.ci-pass { color: #4ade80; }
  .stat-value.ci-fail { color: #fca5a5; }
  .stat-value.ci-undecided { color: #fcd34d; }
  .stat-value.ci-pending { color: #94a3b8; }

  /* Per-machine sub-cards inside aggregated training-progress cards.
     One row per host with five stats: games, secs/game, crashes,
     timed out, workers. Compact — uses the same dark surface + border
     the parent stats grid uses, just smaller padding and font. */
  .machines { margin-top: 14px; display: flex;
    flex-direction: column; gap: 4px; }
  .machines-label { font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 2px; }
  .machine-row { display: grid;
    grid-template-columns: 1fr repeat(5, minmax(80px, auto)) auto;
    align-items: center; gap: 12px;
    padding: 6px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.78rem; }
  .machine-label { font-family: monospace; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .machine-stat { display: flex; flex-direction: column; gap: 2px;
    text-align: right; }
  .machine-stat-label { font-size: 0.6rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; }
  .machine-stat-value { font-family: monospace; font-size: 0.82rem; }

  /* Per-shard "scale workers" control: a small numeric input + Apply
     button to the right of the per-machine stats. The Apply POSTs to
     the master's /api/shards/<host>/workers endpoint. Phase 1: takes
     effect on the NEXT iter; we surface a "pending" hint until the
     next iter's progress JSON shows the new n_workers value. */
  .machine-scale { display: flex; align-items: center; gap: 4px;
    margin-left: 8px; }
  .machine-scale-input { width: 52px; padding: 2px 4px; font-size: 0.78rem;
    font-family: monospace; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    text-align: right; }
  .machine-scale-btn { padding: 2px 8px; font-size: 0.7rem;
    font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    background: transparent; color: #93c5fd; border: 1px solid #1e3a5f;
    border-radius: 4px; cursor: pointer; font-family: inherit; }
  .machine-scale-btn:hover { background: #1e3a5f; color: #bfdbfe; }
  .machine-scale-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .machine-scale-hint { font-size: 0.68rem; color: var(--muted);
    font-style: italic; min-width: 12ch; }
  .machine-scale-hint.pending { color: var(--amber); }
  .machine-scale-hint.error { color: #fca5a5; }

  /* Stop-run button + confirmation modal. The button sits on the
     right side of every running card's header; the modal is a single
     full-page overlay that gets reused across all clicks. */
  .stop-btn {
    margin-left: auto; padding: 4px 12px; font-size: 0.75rem;
    font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    background: transparent; color: #fca5a5; border: 1px solid #4c1d1d;
    border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  .stop-btn:hover { background: #4c1d1d; color: #fecaca; }
  .stop-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .stop-pending { color: var(--amber); font-size: 0.72rem;
    margin-left: 8px; font-style: italic; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 28px;
    max-width: 480px; width: 90vw;
  }
  .modal h2 { font-size: 1.05rem; margin-bottom: 12px; }
  .modal p { font-size: 0.88rem; color: var(--muted);
    margin-bottom: 18px; line-height: 1.5; }
  .modal .modal-actions { display: flex; gap: 10px;
    justify-content: flex-end; }
  .modal button { padding: 8px 16px; font-size: 0.85rem;
    font-weight: 600; border-radius: 6px; cursor: pointer;
    font-family: inherit; }
  .modal .btn-cancel { background: transparent; color: var(--text);
    border: 1px solid var(--border); }
  .modal .btn-cancel:hover { background: var(--bg); }
  .modal .btn-confirm-stop { background: #4c1d1d; color: #fecaca;
    border: 1px solid #7f1d1d; }
  .modal .btn-confirm-stop:hover { background: #7f1d1d; color: #fff; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Training Pipeline Progress</h1>
    <span id="refresh-indicator">loading…</span>
  </header>

  <div id="active"></div>

  <div class="section-title">Older runs</div>
  <div id="older"></div>
</div>

<div class="modal-overlay" id="stop-modal">
  <div class="modal" role="dialog" aria-labelledby="stop-modal-title">
    <h2 id="stop-modal-title">Stop run?</h2>
    <p id="stop-modal-body">
      This will set a stop flag the producer checks at stage
      boundaries. In-flight games finish; new dispatches will be
      skipped. Partial data is preserved.
    </p>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="stop-modal-cancel">
        Cancel
      </button>
      <button type="button" class="btn-confirm-stop"
              id="stop-modal-confirm">
        Stop run
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// Pipeline progress UI. Polls /api/runs every REFRESH_MS and re-renders
// in place — runs are identified by run_id, and DOM scaffolding is
// reused across polls so values tick live without page reloads or
// chart flicker.
//
// Each run has a `kind` discriminator:
//   - "data_gen"  → games-progress card (games/samples/winrate)
//   - "training"  → epochs-progress card (value/policy loss chart)
// The "active" pane stacks all currently-running cards (top to
// bottom in started_at order — gen tends to land before training);
// completed/failed runs drop to the older-runs table.
const REFRESH_MS = 2000;
const refreshEl = document.getElementById('refresh-indicator');
const activeEl = document.getElementById('active');
const olderEl = document.getElementById('older');

// One Chart.js instance per training run, keyed by run_id, so we can
// refresh data without re-instantiating (avoids canvas flicker).
const charts = {};

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmtSeconds(s) {
  if (s == null || !isFinite(s) || s < 0) return '—';
  s = Math.round(s);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  const r = s % 60;
  if (m < 60) return m + 'm ' + r + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

function fmtNum(v, digits) {
  if (v == null || !isFinite(v)) return '—';
  return Number(v).toLocaleString(undefined, {
    minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0,
  });
}

function fmtLoss(v) {
  if (v == null || !isFinite(v)) return '—';
  return Number(v).toFixed(4);
}

// Format the policy_loss_weight scalar for the metadata pill and
// formula subtitle. Always shows at least one decimal so the user
// reads it as a float ("5.0", "2.5"), not as an integer count.
// Non-integer weights preserve up to two decimals, trailing zeros
// trimmed past the first ("2.5", not "2.50"). The weight is a
// hyperparameter, not a measured loss — fmtLoss's four decimals
// would be too noisy.
function fmtPolicyWeight(w) {
  if (w == null || !isFinite(w)) return '—';
  if (Number.isInteger(w)) return Number(w).toFixed(1);
  // Up to 2 decimals, trim trailing zero past the first.
  let s = Number(w).toFixed(2);
  if (s.endsWith('0')) s = s.slice(0, -1);
  return s;
}

function statusClass(s) {
  if (s === 'running' || s === 'completed' || s === 'failed'
      || s === 'stopped') return s;
  return 'unknown';
}

// Wilson 95% score interval on the wins_new proportion of decisive
// games. Mirrors what scripts/eval_early_stop_watcher.py computes
// server-side, so the UI badge tracks the watcher's PASS / FAIL /
// undecided decision visually. The 0.52 acceptance threshold is what
// iterate uses for promote/keep — it's hardcoded here because every
// active iterate run uses it; if iterate ever emits a per-run
// threshold, read it from the progress JSON instead.
const EVAL_GATE_THRESHOLD = 0.52;
// Minimum decisive games before showing a verdict — below this the
// CI is too wide to be informative and the watcher wouldn't fire
// either (see --min-decisive in eval_early_stop_watcher.py). Render
// "n=X (gathering…)" so the user knows the eval is live.
const EVAL_CI_MIN_DECISIVE = 30;
function wilsonInterval(wins, decisive, z) {
  if (!decisive || decisive <= 0) return null;
  const p = wins / decisive;
  const denom = 1 + (z * z) / decisive;
  const center = (p + (z * z) / (2 * decisive)) / denom;
  const half = z * Math.sqrt(
    (p * (1 - p) + (z * z) / (4 * decisive)) / decisive,
  ) / denom;
  return {
    point: p,
    lo: Math.max(0, center - half),
    hi: Math.min(1, center + half),
  };
}
function evalConfidenceCell(winsNew, winsOld, threshold) {
  const decisive = (winsNew || 0) + (winsOld || 0);
  if (decisive < EVAL_CI_MIN_DECISIVE) {
    return {
      text: decisive > 0
        ? 'n=' + decisive + ' (gathering…)'
        : '—',
      cls: 'ci-pending',
    };
  }
  const ci = wilsonInterval(winsNew || 0, decisive, 1.96);
  if (!ci) return { text: '—', cls: 'ci-pending' };
  const range =
    '[' + (ci.lo * 100).toFixed(1) + '%, '
    + (ci.hi * 100).toFixed(1) + '%]';
  if (ci.lo > threshold) {
    return { text: range + ' → PASS', cls: 'ci-pass' };
  }
  if (ci.hi < threshold) {
    return { text: range + ' → FAIL', cls: 'ci-fail' };
  }
  return { text: range + ' → undecided', cls: 'ci-undecided' };
}

// Stop-button + modal wiring. One overlay reused across clicks.
// `pendingStops` tracks runs whose stop has been ack'd by the
// backend but whose progress JSON hasn't yet flipped status — the UI
// shows "stop pending…" until the producer reaches a stage boundary
// and finalizes the run as 'stopped'.
const pendingStops = new Set();
const stopModal = document.getElementById('stop-modal');
const stopModalBody = document.getElementById('stop-modal-body');
const stopModalCancel = document.getElementById('stop-modal-cancel');
const stopModalConfirm = document.getElementById('stop-modal-confirm');
let _pendingStopRunId = null;

function showStopModal(runId) {
  _pendingStopRunId = runId;
  stopModalBody.textContent =
    `Stop ${runId}? In-flight games will finish; new dispatches `
    + 'will be skipped. Partial data is preserved.';
  stopModal.classList.add('show');
  stopModalConfirm.focus();
}

function hideStopModal() {
  _pendingStopRunId = null;
  stopModal.classList.remove('show');
}

stopModalCancel.addEventListener('click', hideStopModal);
stopModal.addEventListener('click', (e) => {
  // Click outside modal box → cancel.
  if (e.target === stopModal) hideStopModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && stopModal.classList.contains('show')) {
    hideStopModal();
  }
});

stopModalConfirm.addEventListener('click', async () => {
  const runId = _pendingStopRunId;
  if (!runId) { hideStopModal(); return; }
  try {
    const res = await fetch(
      '/api/runs/' + encodeURIComponent(runId) + '/stop',
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason: 'ui-button' }) },
    );
    if (res.ok) pendingStops.add(runId);
  } catch (e) {
    // Best-effort — UI will retry next poll. Don't block the user.
  }
  hideStopModal();
  refresh();
});

function pctOfDataGen(run) {
  const total = run.n_games_total || 0;
  if (!total) return 0;
  return Math.min(100, 100 * (run.n_games_done || 0) / total);
}

function pctOfTraining(run) {
  const total = run.total_epochs || 0;
  if (!total) return 0;
  return Math.min(100, 100 * (run.current_epoch || 0) / total);
}

function pctOfEval(run) {
  const total = run.n_games_total || 0;
  if (!total) return 0;
  return Math.min(100, 100 * (run.n_games_done || 0) / total);
}

function pctOfBench(run) {
  // n_games_total is the sum of n_games across all started pairings;
  // n_games_done is the per-pairing in-flight tally aggregated.
  const total = run.n_games_total || 0;
  if (!total) return 0;
  return Math.min(100, 100 * (run.n_games_done || 0) / total);
}

function kindOf(run) {
  // Older trainer runs (pre-instrumentation) wrote no `kind`. Treat
  // them as training so the UI doesn't drop them.
  return run.kind || 'training';
}

// Build the static DOM for one run card. Idempotent: if a card with
// the same run_id already exists, return it without rebuilding.
// data-* attributes carry kind so re-renders only rebuild when kind
// changes (e.g. a renamed run file).
function ensureCard(run) {
  const id = 'card-' + cssEscape(run.run_id);
  let el = document.getElementById(id);
  if (el && el.dataset.kind === kindOf(run)) return el;
  if (el) el.remove();
  const k = kindOf(run);
  el = document.createElement('div');
  el.id = id;
  el.className = 'card';
  el.dataset.kind = k;
  if (k === 'data_gen') {
    el.innerHTML = `
      <div class="run-header">
        <span class="kind-tag data_gen">data gen</span>
        <span class="run-id" data-field="run-id"></span>
        <span class="badge" data-field="status"></span>
        <span class="run-meta" data-field="meta"></span>
        <button type="button" class="stop-btn" data-field="stop"
                hidden>Stop</button>
        <span class="stop-pending" data-field="stop-pending"
              hidden>stop pending…</span>
      </div>
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" data-field="fill" style="width:0%"></div></div>
        <div class="progress-pct" data-field="pct">0%</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-label">Games</div><div class="stat-value" data-field="games">—</div></div>
        <div class="stat"><div class="stat-label">Samples</div><div class="stat-value" data-field="samples">—</div></div>
        <div class="stat"><div class="stat-label">Workers</div><div class="stat-value" data-field="workers">—</div></div>
        <div class="stat"><div class="stat-label">Elapsed</div><div class="stat-value" data-field="elapsed">—</div></div>
        <div class="stat"><div class="stat-label">ETA</div><div class="stat-value" data-field="eta">—</div></div>
        <div class="stat"><div class="stat-label">Games / hr</div><div class="stat-value" data-field="gph">—</div></div>

function cssEscape(s) {
  // CSS.escape exists in modern browsers; minimal fallback for our
  // run_id alphabet (which is conservative anyway).
  return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
}

function fillRun(el, run) {
  const status = statusClass(run.status);
  el.querySelector('[data-field="run-id"]').textContent = run.run_id;
  const statusEl = el.querySelector('[data-field="status"]');
  statusEl.textContent = run.status || 'unknown';
  statusEl.className = 'badge ' + status;

  // Stop button: visible only on running runs. If the user has
  // already clicked stop and the backend ack'd, show "stop pending"
  // chip until the producer flips status to 'stopped'.
  const stopBtn = el.querySelector('[data-field="stop"]');
  const stopPending = el.querySelector('[data-field="stop-pending"]');
  if (stopBtn) {
    if (status === 'running') {
      const isPending = pendingStops.has(run.run_id);
      stopBtn.hidden = isPending;
      if (stopPending) stopPending.hidden = !isPending;
      // Bind exactly once per element. ensureCard rebuilds the el on
      // kind changes, so this handler is fresh per scaffold.
      if (!stopBtn.dataset.wired) {
        stopBtn.dataset.wired = '1';
        stopBtn.addEventListener('click', () => {
          showStopModal(run.run_id);
        });
      }
    } else {
      stopBtn.hidden = true;
      if (stopPending) stopPending.hidden = true;
      // Producer flipped to terminal status — drop the pending badge.
      pendingStops.delete(run.run_id);
    }
  }
  const metaParts = [];
  if (run.git_commit) metaParts.push(run.git_commit);
  if (run.started_at) metaParts.push(run.started_at);
  if (run.notes) metaParts.push(run.notes);
  el.querySelector('[data-field="meta"]').textContent = metaParts.join(' · ');

  const k = kindOf(run);
  const pct = k === 'data_gen' ? pctOfDataGen(run)
    : k === 'eval' ? pctOfEval(run)
    : k === 'bench' ? pctOfBench(run)
    : pctOfTraining(run);
  const fill = el.querySelector('[data-field="fill"]');
  fill.style.width = pct.toFixed(1) + '%';
  // Progress fill color: blue for data_gen, cyan for eval, amber
  // for bench, purple for training; green when completed,
  // red when failed.
  let fillCls = 'progress-fill';
  if (k === 'training') fillCls += ' training';
  if (k === 'eval') fillCls += ' eval';
  if (k === 'bench') fillCls += ' bench';
  if (status === 'completed' || status === 'failed'
      || status === 'stopped') fillCls += ' ' + status;
  fill.className = fillCls;
  el.querySelector('[data-field="pct"]').textContent = pct.toFixed(1) + '%';

  if (k === 'data_gen') {
    const total = run.n_games_total || 0;
    const done = run.n_games_done || 0;
    el.querySelector('[data-field="games"]').textContent = done + ' / ' + total;
    el.querySelector('[data-field="samples"]').textContent = fmtNum(run.n_samples);
    el.querySelector('[data-field="workers"]').textContent = String(run.n_workers || '—');
    el.querySelector('[data-field="elapsed"]').textContent = fmtSeconds(run.elapsed_seconds);
    el.querySelector('[data-field="eta"]').textContent =
      status === 'running' ? fmtSeconds(run.estimated_remaining_seconds) : '—';
    el.querySelector('[data-field="gph"]').textContent = fmtNum(run.games_per_hour, 0);
    el.querySelector('[data-field="sph"]').textContent = fmtNum(run.samples_per_hour, 0);
    el.querySelector('[data-field="winrate"]').textContent =
      (run.p0_wins || 0) + ' / ' + (run.p1_wins || 0) + ' / ' + (run.draws || 0);
    el.querySelector('[data-field="crashed"]').textContent =
      String(run.crashed || 0);
    el.querySelector('[data-field="timed-out"]').textContent =
      String(run.timed_out || 0);
    renderMachines(el, run);
    renderReplaysFooter(el, run);
  } else if (k === 'eval') {
    const total = run.n_games_total || 0;
    const done = run.n_games_done || 0;
    const winRatePct = (run.win_rate != null && isFinite(run.win_rate))
      ? (run.win_rate * 100).toFixed(1) + '%' : '—';
    el.querySelector('[data-field="games"]').textContent = done + ' / ' + total;
    el.querySelector('[data-field="winrate"]').textContent = winRatePct;
    const ciCell = evalConfidenceCell(
      run.wins_new, run.wins_old, EVAL_GATE_THRESHOLD,
    );
    const ciEl = el.querySelector('[data-field="ci"]');
    ciEl.textContent = ciCell.text;
    ciEl.className = 'stat-value ' + ciCell.cls;
    el.querySelector('[data-field="record"]').textContent =
      (run.wins_new || 0) + ' / ' + (run.wins_old || 0) + ' / ' + (run.draws || 0);
    el.querySelector('[data-field="opp"]').textContent =
      esc(run.opponent_label || 'unknown');
    el.querySelector('[data-field="workers"]').textContent = String(run.n_workers || '—');
    el.querySelector('[data-field="elapsed"]').textContent = fmtSeconds(run.elapsed_seconds);
    el.querySelector('[data-field="eta"]').textContent =
      status === 'running' ? fmtSeconds(run.estimated_remaining_seconds) : '—';
    el.querySelector('[data-field="gph"]').textContent = fmtNum(run.games_per_hour, 0);
    el.querySelector('[data-field="crashed"]').textContent =
      String(run.crashed || 0);
    el.querySelector('[data-field="timed-out"]').textContent =
      String(run.timed_out || 0);
    renderMachines(el, run);
    renderReplaysFooter(el, run);
  } else if (k === 'bench') {
    fillBenchCard(el, run);
  } else {
    const totalLoss = (run.train_losses || []).slice(-1)[0];
    const valueLoss = (run.train_value_losses || []).slice(-1)[0];
    const policyLoss = (run.train_policy_losses || []).slice(-1)[0];
    // Backward-compat: progress files written before policy_loss_weight
    // was recorded omit the field. Treat absent (or any non-finite
    // value) as the trainer default 1.0 so old-run cards still render
    // a sensible TOTAL = VALUE + POLICY formula.
    const rawW = run.policy_loss_weight;
    const policyWeight =
      (typeof rawW === 'number' && isFinite(rawW)) ? rawW : 1.0;
    const showWeight = policyWeight !== 1.0;
    el.querySelector('[data-field="epoch"]').textContent =
      (run.current_epoch || 0) + ' / ' + (run.total_epochs || 0);
    el.querySelector('[data-field="elapsed"]').textContent = fmtSeconds(run.elapsed_seconds);
    el.querySelector('[data-field="eta"]').textContent =
      status === 'running' ? fmtSeconds(run.estimated_remaining_seconds) : '—';
    el.querySelector('[data-field="avg"]').textContent = fmtSeconds(run.per_epoch_seconds_avg);
    el.querySelector('[data-field="total"]').textContent = fmtLoss(totalLoss);
    el.querySelector('[data-field="value"]').textContent = fmtLoss(valueLoss);
    el.querySelector('[data-field="policy"]').textContent = fmtLoss(policyLoss);

    // Header pill: only shown when weight differs from the default
    // 1.0. Keeps the common-case header uncluttered while making the
    // multiplier impossible to miss when it's been turned up.
    const pill = el.querySelector('[data-field="policy-weight-pill"]');
    if (pill) {
      if (showWeight) {
        pill.textContent =
          'policy_loss_weight: ' + fmtPolicyWeight(policyWeight);
        pill.hidden = false;
      } else {
        pill.textContent = '';
        pill.hidden = true;
      }
    }

    // TOTAL LOSS formula subtitle + tooltip. Tooltip mirrors the
    // subtitle for users who skim or whose layout truncates the cell.
    const totalStat = el.querySelector('[data-field="total-stat"]');
    const totalSub = el.querySelector('[data-field="total-sub"]');
    const formula = showWeight
      ? 'value + ' + fmtPolicyWeight(policyWeight) + ' × policy'
      : 'value + policy';
    if (totalSub) totalSub.textContent = formula;
    if (totalStat) totalStat.title = formula;

    // POLICY LOSS parenthetical: when the weight ≠ 1.0, append the
    // weighted contribution next to the raw policy number so the
    // user can mentally add value + weighted to recover total.
    const policySub = el.querySelector('[data-field="policy-sub"]');
    if (policySub) {
      if (showWeight && typeof policyLoss === 'number'
          && isFinite(policyLoss)) {
        policySub.textContent =
          '(weighted: ' + fmtLoss(policyWeight * policyLoss) + ')';
        policySub.hidden = false;
      } else {
        policySub.textContent = '';
        policySub.hidden = true;
      }
    }

    renderMachines(el, run);
    drawTrainingChart(el, run);
  }
}

// Cache the per-run replay listings so we don't re-fetch on every poll.
// Key: run_id. Value: { count, replays, fetched_at }.
const replayCache = new Map();

function mainUiBase() {
  // The main mtg_bot UI runs on port 5002; reuse this page's protocol
  // and host so the link works for both localhost AND tailscale access.
  return window.location.protocol + '//' + window.location.hostname + ':5002';
}

function serveBase() {
  // The mtg_bot serve subcommand listens on port 5099 (bundle/queue +
  // run-DB + dynamic worker scaling endpoints). Reuse this page's
  // protocol and host so the link works for both localhost AND
  // tailscale access — same pattern as mainUiBase().
  return window.location.protocol + '//' + window.location.hostname + ':5099';
}

// Module-level Map of host -> { value, status: 'pending' | 'error',
// error?: string }. Populated when the user clicks Apply on a per-
// machine scale row; cleared once the polled progress JSON shows the
// new n_workers actually in use (i.e. the next iter has started). The
// Phase-1 latency between Apply and effect is at least one full
// iter-cycle (self-play + train + eval), so the pending hint can stay
// up for a long time — that's intentional and the operator should see
// it cleared exactly when the next iter's first per-shard JSON
// reports the new value.
const pendingScales = new Map();
// Hosts whose Apply request is in flight RIGHT NOW. Used purely to
// disable the Apply button so a double-click can't fire two POSTs.
const inFlightScales = new Set();

async function applyShardScale(host, n) {
  if (inFlightScales.has(host)) return;
  inFlightScales.add(host);
  try {
    const res = await fetch(
      serveBase() + '/api/shards/' + encodeURIComponent(host) + '/workers',
      { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ n_workers: n }) },
    );
    if (res.ok) {
      pendingScales.set(host, { value: n, status: 'pending' });
    } else {
      let msg = 'HTTP ' + res.status;
      try {
        const body = await res.json();
        if (body && body.error) msg = body.error;
      } catch (_) { /* fall through */ }
      pendingScales.set(host, { value: n, status: 'error', error: msg });
    }
  } catch (e) {
    pendingScales.set(host, {
      value: n, status: 'error', error: 'network error',
    });
  } finally {
    inFlightScales.delete(host);
    refresh();
  }
}

function renderReplaysFooter(el, run) {
  const footer = el.querySelector('[data-field="replays"]');
  if (!footer) return;
  // No replays_dir means iterate ran with capture disabled for this
  // phase — surface that explicitly so the user knows the link's
  // absence isn't a bug.
  if (!run.replays_dir) {
    footer.innerHTML = '<span class="replays-empty">'
      + 'replay capture: off for this run</span>';
    return;
  }
  const cached = replayCache.get(run.run_id);
  // For running cards, the captured-game count grows over time, so
  // refresh the cache periodically. For finalized runs, fetch once and
  // keep — file count won't change.
  const isRunning = run.status === 'running';
  const ttlMs = isRunning ? 15000 : Infinity;
  const stale = !cached
    || (isRunning && Date.now() - cached.fetched_at > ttlMs);
  if (stale) {
    fetch('/api/runs/' + encodeURIComponent(run.run_id) + '/replays')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(data => {
        replayCache.set(run.run_id, {
          count: data.count, replays: data.replays || [],
          fetched_at: Date.now(),
        });
        // Re-render now that data is in.
        renderReplaysFooter(el, run);
      })
      .catch(() => { /* swallow — try again next tick */ });
    if (!cached) {
      footer.innerHTML = '<span class="replays-empty">'
        + 'loading captured games…</span>';
      return;
    }
  }
  const count = cached ? cached.count : 0;
  const replays = cached ? cached.replays : [];
  if (count === 0) {
    footer.innerHTML = '<span class="replays-empty">'
      + 'capture is on but no games saved yet</span>';
    return;
  }
  // The expander state is persisted on the footer node so re-renders
  // don't collapse the user's pane unintentionally.
  const expanded = footer.dataset.expanded === '1';
  const verb = expanded ? 'Hide' : 'View';
  const label = `${verb} ${count} captured game${count === 1 ? '' : 's'}`;
  let html = '<button type="button" class="replays-toggle">'
    + esc(label) + '</button>';
  if (expanded) {
    const base = mainUiBase();
    html += '<div class="replays-list">';
    for (const r of replays) {
      // Strip "game_" prefix and ".json.gz" suffix to get the
      // human-readable game tag like "seed5000123_idx0050".
      const tag = r.filename
        .replace(/\.json\.gz$/, '')
        .replace(/^game_/, '');
      const url = base + '/?replay=' + encodeURIComponent(r.subpath);
      html += '<a href="' + esc(url) + '" target="_blank" rel="noopener">'
        + esc(tag) + '</a>';
    }
    html += '</div>';
  }
  footer.innerHTML = html;
  const btn = footer.querySelector('.replays-toggle');
  if (btn) {
    btn.addEventListener('click', () => {
      footer.dataset.expanded = expanded ? '' : '1';
      renderReplaysFooter(el, run);
    });
  }
}

function fmtSecsPerGame(v) {
  // Per-host secs/game: small magnitudes (single-digit seconds) are
  // common for fast vanilla-creature games, so two-decimal precision
  // is more useful than rounding to whole seconds.
  if (v == null || !isFinite(v) || v < 0) return '—';
  if (v >= 100) return v.toFixed(0) + 's';
  if (v >= 10) return v.toFixed(1) + 's';
  return v.toFixed(2) + 's';
}

function renderMachines(el, run) {
  // Aggregated distributed runs include a `machines` array (one entry
  // per shard). Render as a compact row of mini sub-cards inside the
  // parent card showing per-host stats: games (n_games_done),
  // secs/game, crashes, timed out, workers. Single-machine runs
  // (no aggregator) won't have this key and the section stays hidden.
  //
  // Per-shard "scale workers" control is appended to each row: a
  // numeric input + Apply button that POSTs to the master's
  // /api/shards/<host>/workers endpoint. Phase 1 only: the change
  // takes effect on the NEXT iter; we surface a "pending" hint
  // until the next iter's progress JSON reports the new n_workers.
  const slot = el.querySelector('[data-field="machines"]');
  if (!slot) return;
  const machines = Array.isArray(run.machines) ? run.machines : [];
  if (!machines.length) {
    slot.hidden = true;
    slot.innerHTML = '';
    return;
  }
  slot.hidden = false;
  // Stable label sort so the row order doesn't shuffle between polls
  // (machines come from a glob; sort keys would otherwise depend on
  // filename collation).
  const sorted = [...machines].sort(
    (a, b) => String(a.label || '').localeCompare(String(b.label || '')),
  );
  let html = '<div class="machines-label">Per machine</div>';
  for (const m of sorted) {
    const secsPerGame = (m.per_game_seconds != null
      && isFinite(m.per_game_seconds))
      ? m.per_game_seconds
      : (m.elapsed_seconds && m.n_games_done
        ? m.elapsed_seconds / m.n_games_done
        : null);
    const host = String(m.label || '');
    const currentWorkers = Number(m.n_workers || 0);
    // Resolve any in-flight pending state for this host. If the
    // pending value matches what's now live, the change has landed
    // and we can clear the pending entry.
    let pending = pendingScales.get(host);
    if (pending && pending.status === 'pending'
        && pending.value === currentWorkers) {
      pendingScales.delete(host);
      pending = null;
    }
    let hint = '';
    if (pending) {
      const cls = pending.status === 'error'
        ? 'machine-scale-hint error' : 'machine-scale-hint pending';
      const text = pending.status === 'error'
        ? esc(pending.error || 'apply failed')
        : 'pending → ' + String(pending.value)
          + ' (next iter)';
      hint = '<span class="' + cls + '">' + text + '</span>';
    } else {
      hint = '<span class="machine-scale-hint"></span>';
    }
    const inFlight = inFlightScales.has(host);
    html += '<div class="machine-row">'
      + '<div class="machine-label">' + esc(host || '?') + '</div>'
      + '<div class="machine-stat">'
        + '<div class="machine-stat-label">games</div>'
        + '<div class="machine-stat-value">'
        + String(m.n_games_done || 0) + '</div>'
      + '</div>'
      + '<div class="machine-stat">'
        + '<div class="machine-stat-label">secs/game</div>'
        + '<div class="machine-stat-value">'
        + esc(fmtSecsPerGame(secsPerGame)) + '</div>'
      + '</div>'
      + '<div class="machine-stat">'
        + '<div class="machine-stat-label">crashes</div>'
        + '<div class="machine-stat-value">'
        + String(m.crashed || 0) + '</div>'
      + '</div>'
      + '<div class="machine-stat">'
        + '<div class="machine-stat-label">timed out</div>'
        + '<div class="machine-stat-value">'
        + String(m.timed_out || 0) + '</div>'
      + '</div>'
      + '<div class="machine-stat">'
        + '<div class="machine-stat-label">workers</div>'
        + '<div class="machine-stat-value">'
        + String(currentWorkers) + '</div>'
      + '</div>'
      + '<div class="machine-scale" data-machine-host="' + esc(host) + '">'
        + '<input type="number" class="machine-scale-input"'
          + ' min="1" max="64" step="1"'
          + ' data-field="scale-input" value="'
          + String(pending ? pending.value : currentWorkers) + '" />'
        + '<button type="button" class="machine-scale-btn"'
          + ' data-field="scale-apply"' + (inFlight ? ' disabled' : '')
          + '>Apply</button>'
        + hint
      + '</div>'
      + '</div>';
  }
  slot.innerHTML = html;
  // Wire the Apply buttons. Re-binding on every renderMachines call
  // is fine — the buttons are freshly created each time.
  slot.querySelectorAll('[data-field="scale-apply"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const wrap = btn.closest('.machine-scale');
      if (!wrap) return;
      const host = wrap.dataset.machineHost || '';
      const input = wrap.querySelector('[data-field="scale-input"]');
      if (!input) return;
      const n = Number(input.value);
      if (!Number.isInteger(n) || n < 1 || n > 64) {
        pendingScales.set(host, {
          value: n, status: 'error',
          error: 'value must be 1-64',
        });
        refresh();
        return;
      }
      btn.disabled = true;
      applyShardScale(host, n);
    });
  });
}

function fmtPct(v) {
  if (v == null || !isFinite(v)) return '—';
  return (v * 100).toFixed(1) + '%';
}

function fmtBudget(budgets) {
  // Bench JSON stores budgets as a list of [samples, inner_nodes]
  // pairs. Render each as "K:N" so the UI matches the CLI flag
  // operators recognize.
  if (!Array.isArray(budgets) || !budgets.length) return '—';
  return budgets.map(b => {
    if (!Array.isArray(b) || b.length < 2) return '—';
    return b[0] + ':' + b[1];
  }).join(', ');
}

function fillBenchCard(el, run) {
  // Run-level summary stats.
  const total = run.n_games_total || 0;
  const done = run.n_games_done || 0;
  el.querySelector('[data-field="games"]').textContent =
    done + ' / ' + total;
  const pairings = Array.isArray(run.pairings) ? run.pairings : [];
  el.querySelector('[data-field="pairings-count"]').textContent =
    String(pairings.length);
  el.querySelector('[data-field="ngames"]').textContent =
    String(run.n_games_per_pairing || '—');
  el.querySelector('[data-field="budget"]').textContent =
    fmtBudget(run.budgets);
  el.querySelector('[data-field="belief-m"]').textContent =
    run.include_belief
      ? String(run.belief_m_candidates || '—')
      : 'off';
  el.querySelector('[data-field="device"]').textContent =
    esc(run.nn_device || '—');
  // Show only the basename of the weights path so the stat cell
  // doesn't overflow on long absolute paths.
  const weights = run.weights_path || '';
  const tail = weights.split(/[\\/]/).slice(-2).join('/') || '—';
  const wEl = el.querySelector('[data-field="weights"]');
  wEl.textContent = tail;
  wEl.title = weights;
  el.querySelector('[data-field="elapsed"]').textContent =
    fmtSeconds(run.elapsed_seconds);

  // Per-pairing rows.
  const tbody = el.querySelector('[data-field="pairings"]');
  if (!pairings.length) {
    tbody.innerHTML = `<tr><td colspan="7"
      style="color:var(--muted);font-style:italic;
      text-align:center;padding:14px">
      no pairings yet — first match starts shortly</td></tr>`;
    return;
  }
  const rows = pairings.map(p => {
    const decided = p.n_decided || 0;
    const totalGames = p.n_games || 0;
    const wins = (p.challenger_wins || 0)
      + ' / ' + (p.defender_wins || 0)
      + ((p.draws || 0) ? (' / ' + p.draws + 'd') : '')
      + ((p.crashed || 0) ? (' / ' + p.crashed + 'x') : '');
    const ci = (decided > 0)
      ? '[' + fmtPct(p.ci_low) + ', ' + fmtPct(p.ci_high) + ']'
      : '—';
    const verdict = p.verdict || 'pending';
    const matchUp = esc(p.challenger || '?')
      + ' vs ' + esc(p.defender || '?');
    const pStatus = p.status || 'running';
    return '<tr>'
      + '<td class="match-up">' + matchUp + '</td>'
      + '<td class="num">' + (p.n_games_done || 0)
        + ' / ' + totalGames
        + ' <span style="color:var(--muted)">(' + wins + ')</span>'
        + '</td>'
      + '<td class="num">' + esc(fmtPct(p.win_rate)) + '</td>'
      + '<td class="num">' + esc(ci) + '</td>'
      + '<td><span class="verdict ' + esc(verdict) + '">'
        + esc(verdict) + '</span></td>'
      + '<td class="num">' + esc(fmtSeconds(p.elapsed_seconds))
        + '</td>'
      + '<td><span class="pairing-status '
        + esc(statusClass(pStatus)) + '">'
        + esc(pStatus) + '</span></td>'
      + '</tr>';
  }).join('');
  tbody.innerHTML = rows;
}

function drawTrainingChart(el, run) {
  const canvas = el.querySelector('[data-field="chart"]');
  if (!canvas) return;
  const labels = (run.train_losses || []).map((_, i) => i + 1);
  // Build datasets dynamically: include policy series only when the
  // run actually trained a policy head (any non-NaN value present).
  const trainTotal = run.train_losses || [];
  const valTotal = (run.val_losses || []).map(v => isFinite(v) ? v : null);
  const trainValue = run.train_value_losses || [];
  const valValue = (run.val_value_losses || []).map(v => isFinite(v) ? v : null);
  const trainPolicy = run.train_policy_losses || [];
  const valPolicy = (run.val_policy_losses || []).map(v => isFinite(v) ? v : null);
  const hasPolicy = trainPolicy.some(v => isFinite(v));
  const datasets = [
    { label: 'train (total)', data: trainTotal, borderColor: '#3b82f6',
      backgroundColor: 'rgba(59,130,246,0.10)', tension: 0.2, pointRadius: 0 },
    { label: 'val (total)', data: valTotal, borderColor: '#f59e0b',
      backgroundColor: 'rgba(245,158,11,0.10)', tension: 0.2, pointRadius: 0,
      spanGaps: true },
  ];
  if (hasPolicy) {
    datasets.push(
      { label: 'train value', data: trainValue, borderColor: '#22c55e',
        backgroundColor: 'rgba(34,197,94,0.05)', tension: 0.2, pointRadius: 0,
        borderDash: [4, 3] },
      { label: 'train policy', data: trainPolicy, borderColor: '#a855f7',
        backgroundColor: 'rgba(168,85,247,0.05)', tension: 0.2, pointRadius: 0,
        borderDash: [4, 3] },
    );
  }
  const existing = charts[run.run_id];
  if (!existing) {
    charts[run.run_id] = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets },
      options: {
        animation: false,
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { title: { display: true, text: 'epoch', color: '#8892a4' },
               ticks: { color: '#8892a4' }, grid: { color: '#2a2d3a' } },
          y: { title: { display: true, text: 'loss', color: '#8892a4' },
               ticks: { color: '#8892a4' }, grid: { color: '#2a2d3a' } },
        },
        plugins: { legend: { labels: { color: '#e2e8f0' } } },
      },
    });
  } else {
    existing.data.labels = labels;
    existing.data.datasets = datasets;
    existing.update('none');
  }
}

function renderActive(active) {
  // Prune charts whose run no longer appears in active. (Completed
  // runs slide into the older-runs table where there's no chart.)
  const liveIds = new Set(active.map(r => r.run_id));
  for (const id of Object.keys(charts)) {
    if (!liveIds.has(id)) {
      try { charts[id].destroy(); } catch (e) { /* ignore */ }
      delete charts[id];
    }
  }
  if (!active.length) {
    // Clean any stale active card scaffolds before showing the empty state.
    activeEl.innerHTML = '<div class="empty">No active runs. Kick one off with <code>scripts/generate_training_data.py</code>, <code>scripts/train_nn.py</code>, <code>scripts/evaluate_nn.py</code>, or <code>scripts/bench_ismcts_vs_pimc_strength.py</code>.</div>';
    return;
  }
  // Reuse existing card elements where run_id matches; remove any
  // that no longer appear (they've moved to older-runs). This keeps
  // chart canvases stable across polls.
  const existing = new Map();
  for (const child of Array.from(activeEl.children)) {
    if (child.id && child.id.startsWith('card-')) {
      existing.set(child.id, child);
    }
  }
  const wantIds = new Set(active.map(r => 'card-' + cssEscape(r.run_id)));
  for (const [id, el] of existing) {
    if (!wantIds.has(id)) el.remove();
  }
  // Render in started_at order so the gen card sits above the
  // train card during a typical iteration (gen starts first).
  const ordered = [...active].sort(
    (a, b) => (a.started_at || '').localeCompare(b.started_at || ''),
  );
  for (const run of ordered) {
    const card = ensureCard(run);
    if (!card.parentNode) activeEl.appendChild(card);
    else activeEl.appendChild(card); // re-append to enforce order
    fillRun(card, run);
  }
}

function renderOlder(runs) {
  if (!runs.length) {
    olderEl.innerHTML = '<div class="empty">No older runs.</div>';
    return;
  }
  const rows = runs.map(r => {
    const k = kindOf(r);
    const label = k === 'data_gen' ? 'data gen'
      : k === 'eval' ? 'eval'
      : k === 'bench' ? 'bench'
      : 'training';
    if (k === 'data_gen') {
      return `<tr>
        <td><span class="run-id">${esc(r.run_id)}</span></td>
        <td><span class="kind-tag ${k}">${label}</span></td>
        <td><span class="badge ${statusClass(r.status)}">${esc(r.status || 'unknown')}</span></td>
        <td class="num">${(r.n_games_done || 0)} / ${(r.n_games_total || 0)}</td>
        <td class="num">${esc(fmtNum(r.n_samples))}</td>
        <td class="num">${(r.p0_wins||0)}/${(r.p1_wins||0)}/${(r.draws||0)}</td>
        <td class="num">${esc(fmtSeconds(r.elapsed_seconds))}</td>
        <td class="num">${esc(r.started_at || '')}</td>
      </tr>`;
    }
    if (k === 'eval') {
      const winRatePct = (r.win_rate != null && isFinite(r.win_rate))
        ? (r.win_rate * 100).toFixed(1) + '%' : '—';
      return `<tr>
        <td><span class="run-id">${esc(r.run_id)}</span></td>
        <td><span class="kind-tag ${k}">${label}</span></td>
        <td><span class="badge ${statusClass(r.status)}">${esc(r.status || 'unknown')}</span></td>
        <td class="num">${(r.n_games_done || 0)} / ${(r.n_games_total || 0)}</td>
        <td class="num">${esc(winRatePct)}</td>
        <td class="num">${(r.wins_new||0)}/${(r.wins_old||0)}/${(r.draws||0)}</td>
        <td class="num">${esc(fmtSeconds(r.elapsed_seconds))}</td>
        <td class="num">${esc(r.started_at || '')}</td>
      </tr>`;
    }
    if (k === 'bench') {
      // Aggregate verdict counts across pairings; "loss/samples"
      // column repurposed to show "<n_pairings> pairings", and
      // the "winrate" column shows the verdict mix
      // (e.g. "1 stronger / 2 comparable").
      const pairings = Array.isArray(r.pairings) ? r.pairings : [];
      const verdicts = { stronger: 0, comparable: 0,
        weaker: 0, pending: 0 };
      for (const p of pairings) {
        const v = p.verdict || 'pending';
        verdicts[v] = (verdicts[v] || 0) + 1;
      }
      const verdictParts = [];
      for (const v of ['stronger', 'comparable', 'weaker', 'pending']) {
        if (verdicts[v]) verdictParts.push(verdicts[v] + ' ' + v);
      }
      const verdictCell = verdictParts.length
        ? verdictParts.join(' / ') : '—';
      return `<tr>
        <td><span class="run-id">${esc(r.run_id)}</span></td>
        <td><span class="kind-tag ${k}">${label}</span></td>
        <td><span class="badge ${statusClass(r.status)}">${esc(r.status || 'unknown')}</span></td>
        <td class="num">${(r.n_games_done || 0)} / ${(r.n_games_total || 0)}</td>
        <td class="num">${pairings.length} pairings</td>
        <td class="num">${esc(verdictCell)}</td>
        <td class="num">${esc(fmtSeconds(r.elapsed_seconds))}</td>
        <td class="num">${esc(r.started_at || '')}</td>
      </tr>`;
    }
    const trainFinal = (r.train_losses || []).slice(-1)[0];
    const valFinal = (r.val_losses || []).slice(-1)[0];
    const lossCell = `${esc(fmtLoss(trainFinal))} / ${esc(fmtLoss(valFinal))}`;
    return `<tr>
      <td><span class="run-id">${esc(r.run_id)}</span></td>
      <td><span class="kind-tag ${k}">${label}</span></td>
      <td><span class="badge ${statusClass(r.status)}">${esc(r.status || 'unknown')}</span></td>
      <td class="num">${(r.current_epoch || 0)} / ${(r.total_epochs || 0)}</td>
      <td class="num">${lossCell}</td>
      <td class="num">—</td>
      <td class="num">${esc(fmtSeconds(r.elapsed_seconds))}</td>
      <td class="num">${esc(r.started_at || '')}</td>
    </tr>`;
  }).join('');
  olderEl.innerHTML = `
    <div class="card">
      <table>
        <thead><tr>
          <th>run</th><th>kind</th><th>status</th>
          <th>progress</th><th>loss / samples</th><th>winrate</th>
          <th>duration</th><th>started</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/runs');
    const data = await res.json();
    const runs = data.runs || [];
    const active = runs.filter(r => statusClass(r.status) === 'running');
    const older = runs.filter(r => statusClass(r.status) !== 'running');
    renderActive(active);
    renderOlder(older);
    refreshEl.textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    refreshEl.textContent = 'error: ' + e.message;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
