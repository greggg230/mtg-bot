[package]
name = "mtg_bot_engine"
version = "0.0.1"
edition = "2021"

[lib]
name = "mtg_bot_engine"
crate-type = ["cdylib"]

[dependencies]
# `multiple-pymethods` lets us split #[pymethods] impl GameState
# blocks across separate files (rust/src/state_ops_*.rs) so
# parallel TDD slices can grow methods on the same type without
# merge conflicts on a single block. Tiny runtime cost (one
# inventory registration per block).
pyo3 = { version = "0.23", features = ["extension-module", "multiple-pymethods"] }
# `sha1`: needed by state_ops_fingerprint.rs to produce a SHA1 digest
# that matches scripts/parity_smoke.py:hash_state byte-for-byte. The
# Python side does
# `hashlib.sha1(json.dumps(parts, default=repr, sort_keys=False)).hexdigest()[:12]`;
# the Rust side streams JSON bytes directly into Sha1::update via the
# hand-rolled emitter in state_ops_fingerprint.rs (no serde_json dep
# needed — the previous slice's Value-tree intermediate has been
# replaced with a streaming serializer for ~15x speedup).
sha1 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
