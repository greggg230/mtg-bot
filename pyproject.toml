[project]
name = "mtg-bot"
version = "0.0.1"
description = "A bot that plays Magic: The Gathering and tries to win."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    # CPU-only torch is enough for Phase C scaffolding (network
    # architecture + load/save + single-state inference). For
    # training on a Blackwell GPU (RTX 50-series, sm_120), install
    # the CUDA 12.8 wheel explicitly:
    #   pip install --upgrade torch --index-url \
    #     https://download.pytorch.org/whl/cu128
    # cu126 and earlier wheels were built for sm_50..sm_90 only —
    # they fail at runtime on Blackwell with "no kernel image is
    # available for execution on the device." If a future PyTorch
    # release adds Blackwell support to a different channel, swap
    # the URL accordingly. The pyproject dep stays plain so
    # `pip install -e .` doesn't pull a 3GB CUDA wheel for someone
    # who only wants to run the engine + UI.
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
]

[project.scripts]
mtg-bot = "mtg_bot.__main__:main"
# ``mtg_bot`` (underscore form) is the dispatcher into the
# ``mtg_bot.cli.<subcommand>`` package: ``mtg_bot iterate ...``,
# ``mtg_bot eval --new v16 --old v13 --games 3000``, etc. Reinstall
# (``pip install -e .``) for changes here to land on the PATH.
mtg_bot = "mtg_bot.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_rust"]
# Skip tests marked ``isolated`` by default — they're sensitive to
# accumulated interpreter state from preceding tests (deepcopy stack
# pressure, MCTS C-frame depth) and only run reliably in their own
# pytest invocation. Run them explicitly with `scripts/run_isolated_tests.py`
# or `pytest -m isolated`.
addopts = "--cov=mtg_bot --cov-report=term-missing --cov-fail-under=95 -m 'not isolated'"
markers = [
    "isolated: test must run alone (e.g. perf benchmarks; full suite triggers C-level flakes)",
]

[tool.coverage.run]
source = ["mtg_bot"]
# `core = "sysmon"` pins coverage.py to its PEP 669 sys.monitoring
# backend on Python 3.12+. Under Python 3.11 (which lacks PEP 669)
# coverage.py silently falls back to its legacy C settrace tracer,
# which produced an intermittent Windows access-violation crash during
# the simulation sweep tests (deep call chain through
# state_based_actions + _static_bonuses). 3.13 + sysmon is crash-free.
# Branch coverage is also disabled because coverage.py's sysmon
# backend does not yet support branch tracking; turning it on would
# force the legacy tracer back in and resurrect the crash. Re-enable
# `branch` once coverage gains branch support under sysmon. See
# docs/segfault-fix.md for the full diagnosis.
branch = false
core = "sysmon"
# The ``mtg_bot.cli`` subcommand modules are operator-facing CLI
# entrypoints (iterate, train, shard, serve, eval, bench, capture).
# Their ``main()`` argparse bodies were previously script-level code
# under ``scripts/`` and never participated in coverage — the
# coverage source filter was already package-only. The argparse-
# body lines stay exempted via ``# pragma: no cover`` annotations
# inside the modules. Helpers (``_downsample_one_legal_rows``,
# ``_render_template``, ``_install_kill_handlers``, etc.) ARE
# measured because they're exercised by ``tests/scripts/test_*.py``.
#
# The ``bench*`` subcommand kinds are diagnostic / operator-only
# (``clone``, ``clone-zones``, ``nn-eval-server``, ``per-game-wall``)
# — they need real GPU/process pool/large state to exercise and
# were never part of the test suite. Same for ``capture`` (single-
# machine NN-driven self-play, integration test) and ``eval`` (a
# distributed-eval driver, integration test). Excluded from coverage
# measurement so the unit-test gate isn't dragged down by code that
# requires real infra to exercise.
omit = [
    "src/mtg_bot/cli/bench.py",
    "src/mtg_bot/cli/bench_kinds/*.py",
    "src/mtg_bot/cli/capture.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
